name: Android APK

# Builds an installable APK on every push to the redesign branch or main (or by
# hand from the Actions tab) and publishes it to the "apk-latest" release, so
# one link always downloads the newest build:
#   https://github.com/<owner>/<repo>/releases/download/apk-latest/LuvLyrics.apk

on:
  push:
    branches: [main, claude/luvlyricsapp-ui-redesign-njxgnc]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release builds are signed with android/app/debug.keystore (see
      # android/app/build.gradle), which is gitignored. Android only installs an
      # update over an existing app signed with the same key, so:
      #   1. a repo secret ANDROID_DEBUG_KEYSTORE_BASE64 (base64 of your local
      #      android/app/debug.keystore) wins if set;
      #   2. otherwise use the keystore from Expo's SDK 54 template — the one
      #      `expo prebuild` puts in every project, so it matches local builds.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/debug.keystore
            echo "Using the keystore from the ANDROID_DEBUG_KEYSTORE_BASE64 secret"
          else
            mkdir -p /tmp/tpl && cd /tmp/tpl
            npm pack expo-template-bare-minimum@sdk-54 --silent
            tar -xzf expo-template-bare-minimum-*.tgz package/android/app/debug.keystore
            cp package/android/app/debug.keystore "$GITHUB_WORKSPACE/android/app/debug.keystore"
            echo "Using the Expo SDK 54 template keystore"
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LuvLyrics.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuvLyrics-apk
          path: LuvLyrics.apk
          retention-days: 14

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest LuvLyrics.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "LuvLyrics — latest build" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download LuvLyrics.apk below and open it on your Android phone to install."
